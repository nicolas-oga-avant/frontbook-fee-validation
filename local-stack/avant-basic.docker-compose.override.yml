# Untracked local override: basic wired to the LOCAL CCAPI.
#
#   docker compose -p basic-frontbook-fee-validation up -d web sidekiq
#
services:
  web: &basic-env
    environment:
      # .env.development sets http://credit-card-api-web-1:7100, which is wrong twice
      # over: it assumes the legacy global ab-net (per-project networks break the DNS)
      # and CCAPI listens on 3000 inside its container - 7100 is only the published
      # host port. The failure surfaces as CreditCardApiTimeoutError in ~10ms, a DNS
      # miss dressed up as a timeout.
      CREDIT_CARD_API_ENDPOINT: http://host.docker.internal:7100
      # Must match CCAPI's CONFETTI_ENV, and is what makes the new frontbook pricing
      # strategies visible at all (see FINDINGS #12).
      CONFETTI_ENV: dev
      # Enables config/initializers/zzz_local_transunion_mock.rb. Without a TU mock,
      # every local card application declines with missing_transunion_report.
      MOCK_TRANSUNION: "1"
      # .env.development sets this but the compose web service never loads that
      # file, so Avant::Env.enable_mock_services? is false and BOTH mock
      # initializers silently skip. Set it explicitly.
      ENABLE_MOCK_SERVICES: "1"
      # Production TemplateFlow. Safe because a local stack is not acts_as_prod?, so
      # create_document defaults preview AND allow_unapproved to true: it renders the
      # latest DRAFT and persists nothing. See docs/adr/0002.
      #
      # Valueless on purpose, like the key below: a hardcoded host here WINS over
      # .env.local, so the container would talk to a different TemplateFlow than the one
      # bootstrap.sh verified - and the check would still pass, because it tests the
      # shell's host, not the container's.
      AVANT_TEMPLATES_HOST:
      # basic type-constrains its CCAPI client config to Strings, so a nil here fails the
      # onboarding call before any HTTP happens - and `issue!` just returns false. The
      # value only has to match CCAPI's AUTHORIZATION_SHARED_KEY. See FINDINGS #25.
      CREDIT_CARD_SHARED_KEY: local-validation-shared-key
      # Deliberately valueless: Compose passes it through from the shell that ran `up`,
      # so the credential never lands in this file, which exists to be copied around.
      # It is a production credential - keep it in .env.local, never here.
      AVANT_TEMPLATES_API_KEY:

  sidekiq:
    <<: *basic-env
